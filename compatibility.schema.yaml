# JSON Schema Draft 2020-12 for ../zmk-keybeacon/compatibility.yaml
# See specs/003-zmk-revision-pinning/contracts/compatibility-yaml-schema.md
# for the normative contract. This file is the executable copy consumed by
# scripts/validate_compat.py (L2 schema layer).

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/ykiewang/zmk-keybeacon/compatibility.schema.yaml
title: zmk-keybeacon CompatibilityManifest
type: object
additionalProperties: false
required: [module_version, zmk_known_good, required_symbols, escape_hatch]
properties:
  module_version:
    type: string
    pattern: '^\d+\.\d+\.\d+$'
    description: Semver, must match the git tag at release time.

  zmk_known_good:
    type: object
    additionalProperties: false
    required: [lower, upper]
    properties:
      lower:
        type: string
        pattern: '^[0-9a-f]{7,40}$'
      upper:
        oneOf:
          - { type: string, pattern: '^[0-9a-f]{7,40}$' }
          - { type: 'null' }
      branch_hint:
        type: string
        default: main

  required_symbols:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [name, header, used_in]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        header:
          type: string
          pattern: '^[A-Za-z0-9_./-]+\.h$'
          not: { pattern: '^/' }
        used_in:
          type: string
          pattern: '^[A-Za-z0-9_./-]+\.(c|h)$'
        fallback:
          type: array
          default: []
          items:
            type: string
            pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        emits_macro:
          type: string
          pattern: '^[A-Z_][A-Z0-9_]*$'

  escape_hatch:
    type: object
    additionalProperties: false
    required: [kconfig, default]
    properties:
      kconfig:
        type: string
        pattern: '^CONFIG_ZMK_KEYBEACON_[A-Z0-9_]+$'
      default:
        enum: [y, n]

  ci:
    type: object
    additionalProperties: false
    properties:
      schedule:
        type: string
        default: "0 6 * * *"
      matrix:
        type: object
        additionalProperties: false
        properties:
          zmk_refs:
            type: array
            minItems: 1
            default: [main, 4dd95d7, e844eca2]
            items: { type: string }
          shields:
            type: array
            minItems: 1
            default: [totem_left]
            items: { type: string }
      on_schedule_failure:
        type: object
        additionalProperties: false
        properties:
          create_issue:
            type: boolean
            default: true
          issue_label:
            type: string
            default: compat-break
            pattern: '^[a-z0-9-]+$'
